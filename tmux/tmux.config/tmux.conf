# Kudos: https://github.com/omerxx/dotfiles/blob/master/tmux

# -------------------------------------------------------------------------------------------------=
# NOTE: If the config looks wrong, remember to install plugins with `<prefix> + I`
# NOTE: If you see "ressurect file not found" error, save a new session with `<prefix> + ctrl-s
# -------------------------------------------------------------------------------------------------=

source-file ~/.config/tmux/tmux.reset.conf
set -g default-command "$SHELL"
set -g default-terminal "$TERM"
set -g terminal-overrides ",$TERM:Tc"
set -g mouse on

set -g prefix ^B
set -g base-index 1              # start indexing windows at 1 instead of 0
# set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g pane-border-lines heavy

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'omerxx/tmux-floax'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'
# set -g @continuum-restore 'on'
# set -g @resurrect-strategy-nvim 'session'
# catppuccin/tmux v1.0+ API. The built-in 'slanted' window style renders
# clean connected powerline chevrons with the two-tone number/name split.
# ('custom' separators only got a foreground colour -> floating arrows.)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'slanted'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_flags 'none'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W#{?window_zoomed_flag, ,}'
# Status modules: rounded end caps to match the windows.
set -g @catppuccin_status_left_separator ''
set -g @catppuccin_status_right_separator ''
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_directory_text '#{b:pane_current_path}'

run '~/.tmux/plugins/tpm/tpm'

# Compose the status bar AFTER the plugin defines its @catppuccin_status_* modules.
# No clock here on purpose -- the Starship prompt already shows the date/time.
# Right side pins the hostname instead (handy across klogin/datacraft boxes).
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session} '
set -g status-right "#[fg=#45475a,bg=default]#[fg=#cdd6f4,bg=#45475a]   #H #[fg=#cdd6f4] #[fg=#cdd6f4]  #{b:pane_current_path} #[fg=#45475a,bg=default]#[default]"

bind-key "T" run-shell "sesh connect \"$(
  sesh list | fzf-tmux -p 55%,60% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""
